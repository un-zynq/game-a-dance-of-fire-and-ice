<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>ADOFAI</title>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/adofaiii4.json");
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 100%);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .game-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding: 20px;
      }

      #gameContainer {
        display: block;
        width: 100%;
        max-width: 1280px;
        height: auto;
        min-height: 480px;
        box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5);
        border-radius: 28px;
        overflow: hidden;
        background: #11151f;
      }

      #gameContainer canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
        border-radius: inherit;
      }

      @media (max-width: 768px) {
        .game-wrapper {
          padding: 12px;
        }
        #gameContainer {
          border-radius: 20px;
          min-height: 320px;
        }
      }

      @media (max-height: 600px) {
        body {
          align-items: flex-start;
          padding-top: 20px;
          padding-bottom: 20px;
        }
        .game-wrapper {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-wrapper">
      <div id="gameContainer" class="powerline"></div>
    </div>
    <script defer src="htmlgame.js" type="text/javascript"></script>
  </body>
</html>
